<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أرشيف التيم Pro | بيئة تطوير وإدارة مشاريع الويب</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Cairo & Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'sans-serif'],
            mono: ['Fira Code', 'monospace'],
          },
          colors: {
            slatebg: {
              950: '#080c14',
              900: '#0d1117',
              850: '#121822',
              800: '#161b22',
              700: '#21262d',
              600: '#30363d',
            }
          }
        }
      }
    };
  </script>

  <style>
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #0d1117; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: #484f58; }

    /* Code Editor Line Numbers & Alignment */
    .editor-wrapper {
      position: relative;
      display: flex;
      flex: 1;
      overflow: hidden;
      background-color: #0d1117;
    }
    .line-gutter {
      width: 50px;
      padding: 16px 8px;
      text-align: right;
      background-color: #121822;
      color: #6e7681;
      font-family: 'Fira Code', monospace;
      font-size: 13.5px;
      line-height: 1.65;
      user-select: none;
      border-right: 1px solid #30363d;
      overflow: hidden;
    }
    .code-area {
      flex: 1;
      padding: 16px;
      background-color: #0d1117;
      color: #e6edf3;
      font-family: 'Fira Code', monospace;
      font-size: 13.5px;
      line-height: 1.65;
      border: none;
      outline: none;
      resize: none;
      tab-size: 2;
      white-space: pre;
      overflow: auto;
      direction: ltr;
      text-align: left;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-toast { animation: slideUp 0.25s ease-out forwards; }
  </style>
</head>
<body class="bg-slatebg-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-indigo-600 selection:text-white">

  <!-- ==================== TOAST NOTIFICATIONS ==================== -->
  <div id="toastContainer" class="fixed bottom-5 left-5 z-[100] flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

  <!-- ==================== 1. SECURE LOGIN SCREEN ==================== -->
  <section id="loginScreen" class="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-950/40 via-slatebg-950 to-slatebg-950">
    <div class="max-w-md w-full bg-slatebg-850/90 backdrop-blur-xl rounded-3xl shadow-2xl border border-slatebg-600/80 p-8 sm:p-10">
      <div class="flex flex-col items-center text-center mb-8">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-emerald-500 flex items-center justify-center text-white text-3xl shadow-xl shadow-indigo-500/20 mb-4">
          <i class="fa-solid fa-layer-group"></i>
        </div>
        <h1 class="text-2xl font-black tracking-tight text-white">أرشيف التيم <span class="text-indigo-400">Pro</span></h1>
        <p class="text-xs text-slate-400 mt-1.5">بيئة تطوير وإدارة مشاريع الويب المعتمدة للفريق</p>
      </div>

      <div id="loginError" class="hidden mb-5 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-bold flex items-center gap-2.5">
        <i class="fa-solid fa-shield-xmark text-base shrink-0"></i>
        <span>بيانات الاعتماد غير صحيحة. الوصول مقصور على أعضاء الفريق المصرح لهم.</span>
      </div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label for="emailInput" class="block text-xs font-bold mb-2 text-slate-300">البريد الإلكتروني للعضو</label>
          <div class="relative">
            <span class="absolute inset-y-0 right-3.5 flex items-center text-slate-500">
              <i class="fa-solid fa-envelope"></i>
            </span>
            <input
              type="email"
              id="emailInput"
              dir="ltr"
              required
              autocomplete="off"
              placeholder="member@team-archive.com"
              class="w-full pr-10 pl-4 py-3 rounded-xl bg-slatebg-900 border border-slatebg-600 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none text-sm text-left font-mono text-white transition"
            />
          </div>
        </div>

        <div>
          <label for="passwordInput" class="block text-xs font-bold mb-2 text-slate-300">كلمة المرور</label>
          <div class="relative">
            <span class="absolute inset-y-0 right-3.5 flex items-center text-slate-500">
              <i class="fa-solid fa-key"></i>
            </span>
            <input
              type="password"
              id="passwordInput"
              dir="ltr"
              required
              placeholder="••••••••••••"
              class="w-full pr-10 pl-10 py-3 rounded-xl bg-slatebg-900 border border-slatebg-600 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none text-sm text-left font-mono text-white transition"
            />
            <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 left-3.5 flex items-center text-slate-500 hover:text-slate-200">
              <i id="eyeIcon" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-bold text-sm shadow-lg shadow-indigo-600/25 transition flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>دخول بيئة العمل</span>
        </button>
      </form>

      <div class="mt-7 pt-5 border-t border-slatebg-700 text-center">
        <p class="text-[11px] text-slate-500 flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-lock text-emerald-500"></i>
          <span>بوابة مشفرة • مخصصة لأعضاء الفريق فقط</span>
        </p>
      </div>
    </div>
  </section>

  <!-- ==================== 2. MAIN WORKSPACE ==================== -->
  <div id="appWorkspace" class="hidden flex-col h-screen overflow-hidden">

    <!-- Top Global Navigation Bar -->
    <header class="h-16 bg-slatebg-850 border-b border-slatebg-600 px-3 sm:px-5 flex items-center justify-between shrink-0 z-30 gap-2">
      <!-- Brand & Main Tabs -->
      <div class="flex items-center gap-3 sm:gap-5">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-emerald-500 flex items-center justify-center text-white font-bold shadow">
            <i class="fa-solid fa-code"></i>
          </div>
          <div class="hidden md:block">
            <h1 class="text-sm font-black leading-none text-white">أرشيف التيم <span class="text-indigo-400">Pro</span></h1>
            <span class="text-[10px] text-slate-400">Team Web Engineering Hub</span>
          </div>
        </div>

        <!-- View Switcher -->
        <nav class="flex items-center bg-slatebg-900 p-1 rounded-xl border border-slatebg-600">
          <button id="navArchiveBtn" onclick="switchMainView('archive')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-indigo-600 text-white shadow-sm">
            <i class="fa-solid fa-boxes-stacked"></i>
            <span>استكشاف الأرشيف</span>
            <span id="headerArchiveCount" class="px-1.5 py-0.2 rounded-full text-[10px] font-mono bg-white/20 text-white">0</span>
          </button>
          <button id="navEditorBtn" onclick="switchMainView('editor')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 text-slate-300 hover:text-white">
            <i class="fa-solid fa-laptop-code"></i>
            <span>بيئة التطوير (IDE)</span>
          </button>
        </nav>
      </div>

      <!-- Current Role Info & Logout -->
      <div class="flex items-center gap-2.5">
        <div class="hidden sm:flex items-center gap-2.5 bg-slatebg-900 border border-slatebg-600 px-3 py-1.5 rounded-xl">
          <div id="userAvatar" class="w-7 h-7 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-xs">
            <i class="fa-solid fa-user-shield"></i>
          </div>
          <div class="text-right">
            <div class="flex items-center gap-1.5">
              <span id="currentUserName" class="text-xs font-bold text-white">قائد التيم</span>
              <span id="currentUserRole" class="text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 font-mono font-semibold">System Architect</span>
            </div>
            <p id="currentUserEmail" class="text-[10px] font-mono text-slate-400" dir="ltr">admin@team-archive.com</p>
          </div>
        </div>

        <button onclick="logout()" class="px-3 py-2 rounded-xl bg-rose-500/10 hover:bg-rose-600 text-rose-400 hover:text-white border border-rose-500/20 text-xs font-bold transition flex items-center gap-1.5" title="تسجيل الخروج">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span class="hidden md:inline">خروج</span>
        </button>
      </div>
    </header>

    <!-- ==================== VIEW 1: ARCHIVE EXPLORER COMMAND CENTER ==================== -->
    <div id="archiveExplorerView" class="flex-1 overflow-y-auto bg-slatebg-950 p-4 sm:p-6 lg:p-8">
      <div class="max-w-7xl mx-auto space-y-6">

        <!-- M15: Workspace Analytics Dashboard -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
          <div class="bg-slatebg-850 border border-slatebg-600 rounded-2xl p-4 flex items-center gap-3.5">
            <div class="w-11 h-11 rounded-xl bg-indigo-500/15 text-indigo-400 flex items-center justify-center text-lg shrink-0">
              <i class="fa-solid fa-folder-tree"></i>
            </div>
            <div>
              <p class="text-[11px] text-slate-400 font-semibold">إجمالي المشاريع</p>
              <h3 id="statTotalProjects" class="text-xl font-black text-white font-mono">0</h3>
            </div>
          </div>

          <div class="bg-slatebg-850 border border-slatebg-600 rounded-2xl p-4 flex items-center gap-3.5">
            <div class="w-11 h-11 rounded-xl bg-emerald-500/15 text-emerald-400 flex items-center justify-center text-lg shrink-0">
              <i class="fa-solid fa-rocket"></i>
            </div>
            <div>
              <p class="text-[11px] text-slate-400 font-semibold">جاهز للنشر (Production)</p>
              <h3 id="statProdProjects" class="text-xl font-black text-emerald-400 font-mono">0</h3>
            </div>
          </div>

          <div class="bg-slatebg-850 border border-slatebg-600 rounded-2xl p-4 flex items-center gap-3.5">
            <div class="w-11 h-11 rounded-xl bg-amber-500/15 text-amber-400 flex items-center justify-center text-lg shrink-0">
              <i class="fa-solid fa-code"></i>
            </div>
            <div>
              <p class="text-[11px] text-slate-400 font-semibold">إجمالي الأسطر البرمجية</p>
              <h3 id="statTotalLines" class="text-xl font-black text-white font-mono">0</h3>
            </div>
          </div>

          <div class="bg-slatebg-850 border border-slatebg-600 rounded-2xl p-4 flex items-center gap-3.5">
            <div class="w-11 h-11 rounded-xl bg-purple-500/15 text-purple-400 flex items-center justify-center text-lg shrink-0">
              <i class="fa-solid fa-hard-drive"></i>
            </div>
            <div>
              <p class="text-[11px] text-slate-400 font-semibold">حجم الأرشيف الكلي</p>
              <h3 id="statTotalSize" class="text-xl font-black text-white font-mono">0 KB</h3>
            </div>
          </div>
        </div>

        <!-- Command Header & Backup Controls -->
        <div class="bg-slatebg-850 border border-slatebg-600 rounded-3xl p-5 sm:p-6 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
          <div>
            <h2 class="text-lg sm:text-xl font-extrabold text-white flex items-center gap-2">
              <i class="fa-solid fa-box-archive text-indigo-400"></i>
              <span>مركز قيادة وأرشيف مشاريع التيم</span>
            </h2>
            <p class="text-xs text-slate-400 mt-1">
              كل مشروع يضم ملفات <span class="font-mono text-orange-400">index.html</span> و <span class="font-mono text-sky-400">style.css</span> و <span class="font-mono text-amber-400">script.js</span> مع سجل إصدارات ومهام خاصة.
            </p>
          </div>

          <div class="flex flex-wrap items-center gap-2.5">
            <button onclick="createNewProject(true)" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-lg shadow-indigo-600/20 transition flex items-center gap-2">
              <i class="fa-solid fa-plus"></i>
              <span>مشروع جديد</span>
            </button>

            <button onclick="exportArchiveJson()" class="px-3.5 py-2.5 rounded-xl bg-emerald-600/20 hover:bg-emerald-600 text-emerald-300 hover:text-white border border-emerald-500/30 text-xs font-bold transition flex items-center gap-2">
              <i class="fa-solid fa-file-export"></i>
              <span>تصدير الأرشيف (JSON)</span>
            </button>

            <label class="cursor-pointer px-3.5 py-2.5 rounded-xl bg-slatebg-700 hover:bg-slatebg-600 text-slate-200 text-xs font-bold transition flex items-center gap-2">
              <i class="fa-solid fa-file-import text-indigo-400"></i>
              <span>استيراد (JSON)</span>
              <input type="file" accept=".json,application/json" onchange="importArchiveJson(event)" class="hidden" />
            </label>
          </div>
        </div>

        <!-- Advanced Filter & Layout Bar -->
        <div class="bg-slatebg-850 border border-slatebg-600 rounded-2xl p-4 flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-3">
          <!-- Search -->
          <div class="relative flex-1">
            <span class="absolute inset-y-0 right-3.5 flex items-center text-slate-400 text-sm">
              <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input
              type="text"
              id="archiveSearchInput"
              oninput="renderArchiveExplorer()"
              placeholder="ابحث باسم المشروع، الوصف، الوسوم (Tags)، أو الكود..."
              class="w-full pr-10 pl-4 py-2.5 rounded-xl bg-slatebg-900 border border-slatebg-600 focus:border-indigo-500 outline-none text-xs text-white transition"
            />
          </div>

          <!-- Filters -->
          <div class="flex flex-wrap items-center gap-2">
            <select id="filterScopeSelect" onchange="renderArchiveExplorer()" class="px-3 py-2.5 rounded-xl bg-slatebg-900 border border-slatebg-600 text-xs font-bold text-slate-200 outline-none focus:border-indigo-500">
              <option value="ALL">جميع المشاريع</option>
              <option value="PINNED">المثبتة والمفضلة ⭐</option>
              <option value="MINE">مشاريعي فقط</option>
            </select>

            <select id="filterStatusSelect" onchange="renderArchiveExplorer()" class="px-3 py-2.5 rounded-xl bg-slatebg-900 border border-slatebg-600 text-xs font-bold text-slate-200 outline-none focus:border-indigo-500">
              <option value="ALL">كل الحالات</option>
              <option value="Production">جاهز للنشر (Production)</option>
              <option value="Review">قيد المراجعة (Review)</option>
              <option value="Draft">مسودة (Draft)</option>
            </select>

            <!-- Grid vs Table Toggle -->
            <div class="flex items-center bg-slatebg-900 p-1 rounded-xl border border-slatebg-600">
              <button id="viewGridBtn" onclick="setArchiveViewMode('grid')" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold transition flex items-center gap-1.5">
                <i class="fa-solid fa-grip"></i>
                <span>بطاقات</span>
              </button>
              <button id="viewTableBtn" onclick="setArchiveViewMode('table')" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white text-xs font-bold transition flex items-center gap-1.5">
                <i class="fa-solid fa-table-list"></i>
                <span>جدول</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Projects Grid View -->
        <div id="archiveGridContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>

        <!-- Projects Table View -->
        <div id="archiveTableContainer" class="hidden bg-slatebg-850 border border-slatebg-600 rounded-2xl overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-right border-collapse">
              <thead>
                <tr class="bg-slatebg-900 border-b border-slatebg-600 text-xs font-bold text-slate-300">
                  <th class="py-3.5 px-4">المشروع</th>
                  <th class="py-3.5 px-4">الحالة والأولوية</th>
                  <th class="py-3.5 px-4">المسؤول</th>
                  <th class="py-3.5 px-4">آخر تحديث</th>
                  <th class="py-3.5 px-4 text-center">الإجراءات</th>
                </tr>
              </thead>
              <tbody id="archiveTableBody" class="divide-y divide-slatebg-700 text-xs"></tbody>
            </table>
          </div>
        </div>

      </div>
    </div>

    <!-- ==================== VIEW 2: PRO MULTI-FILE IDE WORKSPACE ==================== -->
    <div id="ideWorkspaceView" class="hidden flex-1 flex-col overflow-hidden bg-slatebg-950">

      <!-- IDE Top Project Metadata & Action Ribbon -->
      <div class="bg-slatebg-850 border-b border-slatebg-600 px-3 sm:px-4 py-2 flex flex-wrap items-center justify-between gap-2 shrink-0">
        
        <!-- Project Title, Status, Priority & Save -->
        <div class="flex items-center gap-2 flex-wrap flex-1 min-w-[280px]">
          <input
            type="text"
            id="ideProjectTitle"
            placeholder="اسم المشروع..."
            class="w-44 sm:w-56 px-3 py-1.5 rounded-xl bg-slatebg-900 border border-slatebg-600 focus:border-indigo-500 outline-none text-xs font-bold text-white"
          />

          <!-- M10: Status & Priority -->
          <select id="ideProjectStatus" class="px-2.5 py-1.5 rounded-xl bg-slatebg-900 border border-slatebg-600 text-xs font-bold text-emerald-400 outline-none">
            <option value="Draft">مسودة (Draft)</option>
            <option value="Review">قيد المراجعة (Review)</option>
            <option value="Production">جاهز للنشر (Production)</option>
          </select>

          <select id="ideProjectPriority" class="px-2.5 py-1.5 rounded-xl bg-slatebg-900 border border-slatebg-600 text-xs font-bold text-amber-400 outline-none">
            <option value="عالية">أولوية عالية 🔥</option>
            <option value="متوسطة" selected>أولوية متوسطة</option>
            <option value="عادية">أولوية عادية</option>
          </select>

          <button onclick="saveCurrentProject(true)" class="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow transition flex items-center gap-1.5">
            <i class="fa-solid fa-floppy-disk"></i>
            <span>حفظ ولقطة</span>
          </button>
        </div>

        <!-- Engineering Power Tools Ribbon -->
        <div class="flex items-center gap-1.5 flex-wrap">
          <!-- M4: Snippets -->
          <button onclick="openModal('snippetsModal')" class="px-2.5 py-1.5 rounded-xl bg-slatebg-700 hover:bg-indigo-600 text-slate-200 hover:text-white text-xs font-bold transition flex items-center gap-1.5" title="مكتبة القوالب والمكونات الجاهزة">
            <i class="fa-solid fa-puzzle-piece text-indigo-400"></i>
            <span class="hidden xl:inline">قوالب جاهزة</span>
          </button>

          <!-- M5: CDN Injector -->
          <button onclick="openModal('cdnModal')" class="px-2.5 py-1.5 rounded-xl bg-slatebg-700 hover:bg-indigo-600 text-slate-200 hover:text-white text-xs font-bold transition flex items-center gap-1.5" title="محقن المكتبات الخارجية السريع">
            <i class="fa-solid fa-plug text-sky-400"></i>
            <span class="hidden xl:inline">مكتبات CDN</span>
          </button>

          <!-- M7: Beautify / Minify -->
          <button onclick="formatActiveCode()" class="px-2.5 py-1.5 rounded-xl bg-slatebg-700 hover:bg-slatebg-600 text-slate-200 text-xs font-bold transition flex items-center gap-1" title="تنسيق الكود تلقائياً (Beautify)">
            <i class="fa-solid fa-wand-magic-sparkles text-purple-400"></i>
            <span class="hidden lg:inline">تنسيق</span>
          </button>

          <button onclick="minifyActiveCode()" class="px-2.5 py-1.5 rounded-xl bg-slatebg-700 hover:bg-slatebg-600 text-slate-200 text-xs font-bold transition flex items-center gap-1" title="ضغط وتصغير الكود (Minify)">
            <i class="fa-solid fa-compress-arrows-alt text-amber-400"></i>
          </button>

          <!-- M8: Code Audit & Linter -->
          <button onclick="runCodeAudit()" class="px-2.5 py-1.5 rounded-xl bg-slatebg-700 hover:bg-slatebg-600 text-slate-200 text-xs font-bold transition flex items-center gap-1.5" title="فحص جودة الكود والـ SEO">
            <i class="fa-solid fa-stethoscope text-emerald-400"></i>
            <span class="hidden lg:inline">فحص الجودة</span>
          </button>

          <!-- M3: Version History -->
          <button onclick="openHistoryModal()" class="px-2.5 py-1.5 rounded-xl bg-slatebg-700 hover:bg-slatebg-600 text-slate-200 text-xs font-bold transition flex items-center gap-1.5" title="سجل الإصدارات والرجوع للخلف">
            <i class="fa-solid fa-clock-rotate-left text-orange-400"></i>
            <span class="hidden xl:inline">الإصدارات</span>
          </button>

          <!-- M11: Notes & Checklist Drawer Toggle -->
