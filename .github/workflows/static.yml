    // 3. STATE & STORAGE
    const STORAGE_KEYS = {
      USER: 'team_pro_user_v3',
      PROJECTS: 'team_pro_projects_v3'
    };

    let currentUser = null;
    let projects = [];
    let activeProjectId = null;
    let activeFileTab = 'html'; // 'html' | 'css' | 'js'
    let archiveViewMode = 'grid'; // 'grid' | 'table'
    let isPreviewFullscreen = false;
    let projectToDeleteId = null;

    // Editor Buffer for current active project
    let editorBuffers = { html: '', css: '', js: '' };
    let currentProjectTasks = [];

    // 4. INITIALIZATION
    window.addEventListener('DOMContentLoaded', () => {
      loadProjects();
      checkSharedUrlPayload();
      checkSession();
      bindIdeEvents();
    });

    // Check if opened via a shared Base64 URL Hash
    function checkSharedUrlPayload() {
      if (window.location.hash && window.location.hash.startsWith('#share=')) {
        try {
          const encoded = window.location.hash.replace('#share=', '');
          const decodedJson = decodeURIComponent(escape(atob(encoded)));
          const sharedProj = JSON.parse(decodedJson);
          if (sharedProj && sharedProj.title && sharedProj.html !== undefined) {
            const exists = projects.some(p => p.title === sharedProj.title && p.html === sharedProj.html);
            if (!exists) {
              sharedProj.id = 'proj-shared-' + Date.now();
              sharedProj.updatedAt = formatNow();
              projects.unshift(sharedProj);
              saveProjectsToStorage();
              showToast(`تم استيراد المشروع المشترك "${sharedProj.title}" إلى الأرشيف!`, 'success');
            }
            history.replaceState(null, null, ' ');
          }
        } catch (e) {
          console.warn('Invalid share hash');
        }
      }
    }

    // 5. AUTHENTICATION
    function togglePasswordVisibility() {
      const inp = document.getElementById('passwordInput');
      const icon = document.getElementById('eyeIcon');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        inp.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      const pass = document.getElementById('passwordInput').value;
      const errBox = document.getElementById('loginError');

      const user = TEAM_USERS.find(u => u.email.toLowerCase() === email && u.password === pass);
      if (!user) {
        errBox.classList.remove('hidden');
        return;
      }

      errBox.classList.add('hidden');
      currentUser = user;
      localStorage.setItem(STORAGE_KEYS.USER, JSON.stringify(user));
      enterWorkspace();
      showToast(`مرحباً بك، ${user.name}`, 'success');
    });

    function checkSession() {
      const saved = localStorage.getItem(STORAGE_KEYS.USER);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          const valid = TEAM_USERS.find(u => u.email === parsed.email);
          if (valid) {
            currentUser = valid;
            enterWorkspace();
          }
        } catch (e) {
          localStorage.removeItem(STORAGE_KEYS.USER);
        }
      }
    }

    function enterWorkspace() {
      document.getElementById('loginScreen').classList.add('hidden');
      const ws = document.getElementById('appWorkspace');
      ws.classList.remove('hidden');
      ws.classList.add('flex');

      document.getElementById('currentUserName').textContent = currentUser.name;
      document.getElementById('currentUserRole').textContent = currentUser.role;
      document.getElementById('currentUserEmail').textContent = currentUser.email;
      document.getElementById('userAvatar').className = `w-7 h-7 rounded-lg ${currentUser.badgeColor} text-white flex items-center justify-center font-bold text-xs`;

      updateDashboardAnalytics();
      renderArchiveExplorer();

      if (projects.length > 0 && !activeProjectId) {
        loadProjectIntoIde(projects[0].id, false);
      }
    }

    function logout() {
      localStorage.removeItem(STORAGE_KEYS.USER);
      currentUser = null;
      document.getElementById('appWorkspace').classList.add('hidden');
      document.getElementById('appWorkspace').classList.remove('flex');
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('emailInput').value = '';
      document.getElementById('passwordInput').value = '';
      showToast('تم تسجيل الخروج بنجاح', 'info');
    }

    // 6. VIEW SWITCHING (Archive Explorer <-> Pro IDE)
    function switchMainView(view) {
      const archiveView = document.getElementById('archiveExplorerView');
      const ideView = document.getElementById('ideWorkspaceView');
      const navArchiveBtn = document.getElementById('navArchiveBtn');
      const navEditorBtn = document.getElementById('navEditorBtn');

      if (view === 'archive') {
        archiveView.classList.remove('hidden');
        ideView.classList.add('hidden');
        ideView.classList.remove('flex');

        navArchiveBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-indigo-600 text-white shadow-sm';
        navEditorBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 text-slate-300 hover:text-white';
        updateDashboardAnalytics();
        renderArchiveExplorer();
      } else {
        archiveView.classList.add('hidden');
        ideView.classList.remove('hidden');
        ideView.classList.add('flex');

        navEditorBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-indigo-600 text-white shadow-sm';
        navArchiveBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 text-slate-300 hover:text-white';
        renderLivePreview(false);
      }
    }

    // 7. ARCHIVE STORAGE & ANALYTICS (M15)
    function loadProjects() {
      const raw = localStorage.getItem(STORAGE_KEYS.PROJECTS);
      if (raw) {
        try {
          projects = JSON.parse(raw);
        } catch (e) {
          projects = [...INITIAL_PROJECTS];
        }
      } else {
        projects = [...INITIAL_PROJECTS];
        saveProjectsToStorage();
      }
    }

    function saveProjectsToStorage() {
      localStorage.setItem(STORAGE_KEYS.PROJECTS, JSON.stringify(projects));
      updateDashboardAnalytics();
    }

    function updateDashboardAnalytics() {
      document.getElementById('headerArchiveCount').textContent = projects.length;
      document.getElementById('statTotalProjects').textContent = projects.length;
      document.getElementById('statProdProjects').textContent = projects.filter(p => p.status === 'Production').length;

      let totalLines = 0;
      let totalBytes = 0;
      projects.forEach(p => {
        const combined = (p.html || '') + '\n' + (p.css || '') + '\n' + (p.js || '');
        totalLines += combined.split('\n').length;
        totalBytes += new Blob([combined]).size;
      });

      document.getElementById('statTotalLines').textContent = totalLines.toLocaleString();
      document.getElementById('statTotalSize').textContent = totalBytes < 1024 ? `${totalBytes} B` : `${(totalBytes / 1024).toFixed(1)} KB`;
    }

    function setArchiveViewMode(mode) {
      archiveViewMode = mode;
      const gridBtn = document.getElementById('viewGridBtn');
      const tableBtn = document.getElementById('viewTableBtn');
      const gridCont = document.getElementById('archiveGridContainer');
      const tableCont = document.getElementById('archiveTableContainer');

      if (mode === 'grid') {
        gridBtn.className = 'px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold transition flex items-center gap-1.5';
        tableBtn.className = 'px-3 py-1.5 rounded-lg text-slate-400 hover:text-white text-xs font-bold transition flex items-center gap-1.5';
        gridCont.classList.remove('hidden');
        tableCont.classList.add('hidden');
      } else {
        tableBtn.className = 'px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold transition flex items-center gap-1.5';
        gridBtn.className = 'px-3 py-1.5 rounded-lg text-slate-400 hover:text-white text-xs font-bold transition flex items-center gap-1.5';
        gridCont.classList.add('hidden');
        tableCont.classList.remove('hidden');
      }
    }

    function getStatusBadge(status) {
      if (status === 'Production') return '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">جاهز للنشر</span>';
      if (status === 'Review') return '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-500/15 text-amber-400 border border-amber-500/30">قيد المراجعة</span>';
      return '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-500/20 text-slate-300 border border-slate-500/30">مسودة</span>';
    }

    function renderArchiveExplorer() {
      const q = (document.getElementById('archiveSearchInput')?.value || '').trim().toLowerCase();
      const scope = document.getElementById('filterScopeSelect')?.value || 'ALL';
      const statusFilter = document.getElementById('filterStatusSelect')?.value || 'ALL';

      // Sort pinned projects first
      const sorted = [...projects].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

      const filtered = sorted.filter(p => {
        const matchText =
          p.title.toLowerCase().includes(q) ||
          (p.description || '').toLowerCase().includes(q) ||
          (p.tags || []).some(t => t.toLowerCase().includes(q)) ||
          (p.html || '').toLowerCase().includes(q);

        let matchScope = true;
        if (scope === 'PINNED') matchScope = !!p.pinned;
        if (scope === 'MINE') matchScope = currentUser && p.authorEmail === currentUser.email;

        let matchStatus = true;
        if (statusFilter !== 'ALL') matchStatus = p.status === statusFilter;

        return matchText && matchScope && matchStatus;
      });

      const gridCont = document.getElementById('archiveGridContainer');
      const tableBody = document.getElementById('archiveTableBody');

      if (filtered.length === 0) {
        gridCont.innerHTML = `
          <div class="col-span-full bg-slatebg-850 border border-slatebg-600 rounded-3xl p-12 text-center">
            <i class="fa-regular fa-folder-open text-4xl text-slate-500 mb-3"></i>
            <h3 class="text-base font-bold text-white mb-1">لا توجد مشاريع مطابقة للبحث</h3>
            <p class="text-xs text-slate-400 mb-4">قم بتغيير خيارات الفلترة أو أنشئ مشروعاً جديداً الآن.</p>
            <button onclick="createNewProject(true)" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold">إنشاء مشروع جديد</button>
          </div>`;
        tableBody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-400">لا توجد مشاريع مطابقة</td></tr>`;
        return;
      }

      // Render Cards
      gridCont.innerHTML = filtered.map(p => {
        const tagsHtml = (p.tags || []).slice(0, 3).map(t => `<span class="px-2 py-0.5 rounded bg-slatebg-900 text-indigo-300 font-mono text-[10px] border border-slatebg-700">#${escapeHtml(t)}</span>`).join('');
        return `
          <div class="bg-slatebg-850 border ${p.pinned ? 'border-amber-500/50' : 'border-slatebg-600'} rounded-2xl p-5 flex flex-col justify-between hover:border-indigo-500/60 transition shadow-lg group">
            <div>
              <div class="flex items-start justify-between gap-2 mb-3">
                <div class="flex items-center gap-2">
                  ${getStatusBadge(p.status)}
                  <span class="text-[10px] text-slate-400 font-bold">أولوية ${p.priority || 'متوسطة'}</span>
                </div>
                <!-- M12: Pin / Star Toggle -->
                <button onclick="togglePinProject('${p.id}')" class="text-sm ${p.pinned ? 'text-amber-400' : 'text-slate-500 hover:text-amber-300'} transition" title="تثبيت المشروع في الأعلى">
                  <i class="fa-solid fa-star"></i>
                </button>
              </div>

              <h3 class="text-base font-extrabold text-white group-hover:text-indigo-400 transition mb-1.5 line-clamp-1">${escapeHtml(p.title)}</h3>
              <p class="text-xs text-slate-400 leading-relaxed mb-3 line-clamp-2 min-h-[36px]">${escapeHtml(p.description || 'مشروع ويب متعدد الملفات محفوظ في أرشيف الفريق.')}</p>

              <div class="flex flex-wrap gap-1.5 mb-4">${tagsHtml}</div>
            </div>

            <div class="pt-3 border-t border-slatebg-700 space-y-3">
              <div class="flex items-center justify-between text-[11px] text-slate-400">
                <span class="font-semibold text-slate-300"><i class="fa-solid fa-user-gear text-indigo-400 ml-1"></i>${escapeHtml(p.authorName)}</span>
                <span dir="ltr" class="font-mono text-[10px]">${p.updatedAt}</span>
              </div>

              <div class="grid grid-cols-5 gap-1.5">
                <button onclick="loadProjectIntoIde('${p.id}', true)" class="col-span-2 py-2 px-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition flex items-center justify-center gap-1">
                  <i class="fa-solid fa-code"></i><span>تطوير</span>
                </button>
                <button onclick="openQuickPreview('${p.id}')" class="py-2 rounded-xl bg-slatebg-700 hover:bg-sky-600 text-slate-200 hover:text-white text-xs transition flex items-center justify-center" title="معاينة كاملة">
                  <i class="fa-solid fa-eye"></i>
                </button>
                <!-- M13: Clone / Fork -->
                <button onclick="cloneProject('${p.id}')" class="py-2 rounded-xl bg-slatebg-700 hover:bg-purple-600 text-slate-200 hover:text-white text-xs transition flex items-center justify-center" title="استنساخ المشروع (Fork)">
                  <i class="fa-solid fa-code-branch"></i>
                </button>
                <button onclick="promptDeleteProject('${p.id}')" class="py-2 rounded-xl bg-slatebg-700 hover:bg-rose-600 text-slate-200 hover:text-white text-xs transition flex items-center justify-center" title="حذف">
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // Render Table
      tableBody.innerHTML = filtered.map(p => `
        <tr class="hover:bg-slatebg-900/60 transition">
          <td class="py-3.5 px-4">
            <div class="font-bold text-white flex items-center gap-2">
              <button onclick="togglePinProject('${p.id}')" class="${p.pinned ? 'text-amber-400' : 'text-slate-600'}"><i class="fa-solid fa-star"></i></button>
              <span>${escapeHtml(p.title)}</span>
            </div>
            <div class="text-[11px] text-slate-400 mt-0.5 line-clamp-1">${escapeHtml(p.description || '—')}</div>
          </td>
          <td class="py-3.5 px-4">${getStatusBadge(p.status)} <span class="text-[11px] text-slate-400 mr-1">(${p.priority})</span></td>
          <td class="py-3.5 px-4 font-semibold text-slate-300">${escapeHtml(p.authorName)}</td>
          <td class="py-3.5 px-4 font-mono text-[11px] text-slate-400" dir="ltr">${p.updatedAt}</td>
          <td class="py-3.5 px-4">
            <div class="flex items-center justify-center gap-1.5">
              <button onclick="loadProjectIntoIde('${p.id}', true)" class="px-2.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-bold">فتح</button>
              <button onclick="openQuickPreview('${p.id}')" class="p-1.5 rounded-lg bg-slatebg-700 hover:bg-sky-600 text-white" title="معاينة"><i class="fa-solid fa-eye"></i></button>
              <button onclick="cloneProject('${p.id}')" class="p-1.5 rounded-lg bg-slatebg-700 hover:bg-purple-600 text-white" title="استنساخ"><i class="fa-solid fa-code-branch"></i></button>
              <button onclick="promptDeleteProject('${p.id}')" class="p-1.5 rounded-lg bg-slatebg-700 hover:bg-rose-600 text-white" title="حذف"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    // M12: Pin / Unpin Project
    function togglePinProject(id) {
      const idx = projects.findIndex(p => p.id === id);
      if (idx === -1) return;
      projects[idx].pinned = !projects[idx].pinned;
      saveProjectsToStorage();
      renderArchiveExplorer();
      showToast(projects[idx].pinned ? 'تم تثبيت المشروع في أعلى الأرشيف ⭐' : 'تم إلغاء تثبيت المشروع', 'info');
    }

    // M13: Clone / Fork Project
    function cloneProject(id) {
      const orig = projects.find(p => p.id === id);
      if (!orig) return;
      const copy = JSON.parse(JSON.stringify(orig));
      copy.id = 'proj-fork-' + Date.now();
      copy.title = `${orig.title} (نسخة مستنسخة)`;
      copy.pinned = false;
      copy.status = 'Draft';
      copy.authorName = currentUser ? currentUser.name : orig.authorName;
      copy.authorEmail = currentUser ? currentUser.email : orig.authorEmail;
      copy.updatedAt = formatNow();
      copy.history = [];

      projects.unshift(copy);
      saveProjectsToStorage();
      renderArchiveExplorer();
      showToast(`تم استنساخ "${orig.title}" بنجاح!`, 'success');
    }

    // Quick Preview Modal
    function openQuickPreview(id) {
      const p = projects.find(x => x.id === id);
      if (!p) return;
      document.getElementById('qpTitle').textContent = p.title;
      document.getElementById('qpMeta').textContent = `${p.status} • ${p.authorName}`;
      document.getElementById('qpIframe').srcdoc = buildCombinedHtml(p.html, p.css, p.js, false);

      document.getElementById('qpOpenIdeBtn').onclick = () => { closeQuickPreview(); loadProjectIntoIde(p.id, true); };
      document.getElementById('qpCloneBtn').onclick = () => { closeQuickPreview(); cloneProject(p.id); };
      document.getElementById('qpDownloadBtn').onclick = () => {
        triggerDownload(`${sanitizeFilename(p.title)}.html`, buildCombinedHtml(p.html, p.css, p.js, false), 'text/html');
      };

      document.getElementById('quickPreviewModal').classList.remove('hidden');
    }

    function closeQuickPreview() {
      document.getElementById('quickPreviewModal').classList.add('hidden');
      document.getElementById('qpIframe').srcdoc = '';
    }

    // Delete Project
    function promptDeleteProject(id) {
      const p = projects.find(x => x.id === id);
      if (!p) return;
      projectToDeleteId = id;
      document.getElementById('deleteProjTitleSpan').textContent = `"${p.title}"`;
      openModal('deleteModal');
    }

    document.getElementById('confirmDeleteActionBtn').addEventListener('click', () => {
      if (!projectToDeleteId) return;
      projects = projects.filter(p => p.id !== projectToDeleteId);
      saveProjectsToStorage();
      renderArchiveExplorer();
      closeModal('deleteModal');
      showToast('تم حذف المشروع من الأرشيف', 'info');
    });

    // Export / Import JSON Archive
    function exportArchiveJson() {
      const data = {
        platform: 'Team HTML Archive Pro',
        exportedAt: new Date().toISOString(),
        exportedBy: currentUser ? currentUser.name : 'Team',
        projects
      };
      triggerDownload(`team-archive-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data, null, 2), 'application/json');
      showToast('تم تصدير نسخة الأرشيف الكاملة (JSON)', 'success');
    }

    function importArchiveJson(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          const list = Array.isArray(parsed) ? parsed : parsed.projects;
          if (!Array.isArray(list)) throw new Error('Invalid');
          let added = 0;
          list.forEach(item => {
            if (item && item.title) {
              item.id = 'proj-imp-' + Date.now() + Math.random().toString(36).slice(2, 5);
              projects.unshift(item);
              added++;
            }
          });
          saveProjectsToStorage();
          renderArchiveExplorer();
          showToast(`تم استيراد ${added} مشروع إلى الأرشيف!`, 'success');
        } catch (err) {
          showToast('خطأ في قراءة ملف JSON', 'error');
        }
        e.target.value = '';
      };
      reader.readAsText(file);
    }

    // 8. MULTI-FILE PRO IDE LOGIC (M1, M2, M3, M4, M5, M6, M7, M8, M9, M11, M14)
    function createNewProject(switchToIde = false) {
      const newProj = {
        id: 'proj-' + Date.now(),
        title: 'مشروع ويب جديد',
        description: '',
        status: 'Draft',
        priority: 'متوسطة',
        pinned: false,
        tags: ['HTML5', 'New'],
        authorName: currentUser ? currentUser.name : 'عضو الفريق',
        authorEmail: currentUser ? currentUser.email : 'team@archive.com',
        updatedAt: formatNow(),
        notes: '',
        tasks: [],
        html: `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشروع جديد</title>
</head>
<body>
  <main class="box">
    <h1>مرحباً بك في بيئة التطوير المتكاملة 🚀</h1>
    <p>اكتب أكواد HTML و CSS و JavaScript في التبويبات المجاورة وشاهد النتيجة فوراً.</p>
  </main>
</body>
</html>`,
        css: `body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: #0f172a;
  color: #f8fafc;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}
.box {
  background: #1e293b;
  border: 1px solid #334155;
  padding: 2.5rem;
  border-radius: 20px;
  text-align: center;
  max-width: 520px;
}`,
        js: `console.log('Project initialized successfully!');`,
        history: []
      };

      projects.unshift(newProj);
      saveProjectsToStorage();
      loadProjectIntoIde(newProj.id, switchToIde);
      showToast('تم إنشاء مشروع جديد متعدد الملفات', 'success');
    }

    function loadProjectIntoIde(id, openView = true) {
      const p = projects.find(x => x.id === id);
      if (!p) return;

      activeProjectId = p.id;
      editorBuffers = {
        html: p.html || '',
        css: p.css || '',
        js: p.js || ''
      };
      currentProjectTasks = JSON.parse(JSON.stringify(p.tasks || []));

      document.getElementById('ideProjectTitle').value = p.title;
      document.getElementById('ideProjectStatus').value = p.status || 'Draft';
      document.getElementById('ideProjectPriority').value = p.priority || 'متوسطة';
      document.getElementById('ideProjectDesc').value = p.description || '';
      document.getElementById('ideProjectTags').value = (p.tags || []).join(', ');
      document.getElementById('ideProjectNotes').value = p.notes || '';

      renderTasksList();
      switchEditorTab('html', false);
      clearLiveConsole();
      renderLivePreview(false);

      if (openView) {
        switchMainView('editor');
      }
    }

    // M1: Switch between index.html, style.css, script.js
    function switchEditorTab(tab, savePrev = true) {
      const textarea = document.getElementById('ideCodeTextarea');
      if (savePrev && activeFileTab) {
        editorBuffers[activeFileTab] = textarea.value;
      }

      activeFileTab = tab;
      textarea.value = editorBuffers[tab] || '';

      document.querySelectorAll('.file-tab').forEach(btn => {
        if (btn.dataset.ftab === tab) {
          btn.className = 'file-tab px-3 py-1 rounded-lg text-xs font-mono font-bold bg-slatebg-900 text-white border border-indigo-500 flex items-center gap-1.5';
        } else {
          btn.className = 'file-tab px-3 py-1 rounded-lg text-xs font-mono font-bold text-slate-400 hover:text-white flex items-center gap-1.5';
        }
      });

      updateGutterLines();
      updateFindCount();
    }

    function bindIdeEvents() {
      const textarea = document.getElementById('ideCodeTextarea');
      const gutter = document.getElementById('ideLineGutter');

      textarea.addEventListener('input', () => {
        editorBuffers[activeFileTab] = textarea.value;
        updateGutterLines();
        updateCursorInfo();
        renderLivePreview(false);
      });

      textarea.addEventListener('scroll', () => {
        gutter.scrollTop = textarea.scrollTop;
      });

      textarea.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
          e.preventDefault();
          const s = textarea.selectionStart;
          const end = textarea.selectionEnd;
          textarea.value = textarea.value.substring(0, s) + '  ' + textarea.value.substring(end);
          textarea.selectionStart = textarea.selectionEnd = s + 2;
          editorBuffers[activeFileTab] = textarea.value;
          updateGutterLines();
        }
      });

      textarea.addEventListener('click', updateCursorInfo);
      textarea.addEventListener('keyup', updateCursorInfo);

      // Listen to console messages posted from Live Preview Iframe (M2)
      window.addEventListener('message', (event) => {
        if (event.data && event.data.source === 'TEAM_IDE_CONSOLE') {
          appendConsoleMessage(event.data.level, event.data.message);
        }
      });
    }

    function updateGutterLines() {
      const lines = document.getElementById('ideCodeTextarea').value.split('\n').length;
      document.getElementById('ideLineGutter').innerHTML = Array.from({ length: lines }, (_, i) => i + 1).join('<br>');
    }

    function updateCursorInfo() {
      const ta = document.getElementById('ideCodeTextarea');
      const sub = ta.value.substring(0, ta.selectionStart).split('\n');
      document.getElementById('ideCursorPos').textContent = `Ln ${sub.length}, Col ${sub[sub.length - 1].length + 1}`;
    }

    // Build unified HTML combining HTML + CSS + JS (+ Console Interceptor if preview)
    function buildCombinedHtml(htmlCode, cssCode, jsCode, injectConsoleHook = true) {
      const consoleHookScript = injectConsoleHook ? `
<script>
(function(){
  const send = (level, args) => {
    try {
      const msg = Array.from(args).map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
      window.parent.postMessage({ source: 'TEAM_IDE_CONSOLE', level, message: msg }, '*');
    } catch(e){}
  };
  const origLog = console.log, origWarn = console.warn, origErr = console.error;
  console.log = function(){ send('log', arguments); origLog.apply(console, arguments); };
  console.warn = function(){ send('warn', arguments); origWarn.apply(console, arguments); };
  console.error = function(){ send('error', arguments); origErr.apply(console, arguments); };
  window.onerror = function(msg, url, line){
    send('error', [msg + ' (Line ' + line + ')']);
  };
})();
<\/script>` : '';

      let output = htmlCode || '';
      const styleTag = cssCode && cssCode.trim() ? `<style>\n${cssCode}\n</style>` : '';
      const scriptTag = jsCode && jsCode.trim() ? `<script>\n${jsCode}\n<\/script>` : '';

      if (output.includes('</head>')) {
        output = output.replace('</head>', `${consoleHookScript}\n${styleTag}\n</head>`);
      } else {
        output = `${consoleHookScript}\n${styleTag}\n` + output;
      }

      if (output.includes('</body>')) {
        output = output.replace('</body>', `${scriptTag}\n</body>`);
      } else {
        output = output + `\n${scriptTag}`;
      }

      return output;
    }

    function renderLivePreview(manual = false) {
      editorBuffers[activeFileTab] = document.getElementById('ideCodeTextarea').value;
      if (manual) clearLiveConsole();
      const fullDoc = buildCombinedHtml(editorBuffers.html, editorBuffers.css, editorBuffers.js, true);
      document.getElementById('ideLiveIframe').srcdoc = fullDoc;
      if (manual) showToast('تم تحديث المعاينة الحية', 'info');
    }

    // M2: Live Console Helpers
    let consoleMsgCounter = 0;
    function appendConsoleMessage(level, text) {
      const body = document.getElementById('liveConsoleBody');
      if (consoleMsgCounter === 0) body.innerHTML = '';
      consoleMsgCounter++;
      document.getElementById('consoleBadgeCount').textContent = consoleMsgCounter;

      const colors = {
        log: 'text-slate-200',
        warn: 'text-amber-400 bg-amber-500/10 px-1.5 py-0.5 rounded',
        error: 'text-rose-400 bg-rose-500/10 px-1.5 py-0.5 rounded font-bold'
      };
      const row = document.createElement('div');
      row.className = colors[level] || colors.log;
      row.textContent = `> [${level.toUpperCase()}] ${text}`;
      body.appendChild(row);
      body.scrollTop = body.scrollHeight;
    }

    function clearLiveConsole() {
      consoleMsgCounter = 0;
      document.getElementById('consoleBadgeCount').textContent = '0';
      document.getElementById('liveConsoleBody').innerHTML = '<div class="text-slate-500 italic">// Console cleared.</div>';
    }

    function toggleConsoleBody() {
      const body = document.getElementById('liveConsoleBody');
      const chev = document.getElementById('consoleChevron');
      body.classList.toggle('hidden');
      chev.classList.toggle('fa-chevron-up');
      chev.classList.toggle('fa-chevron-down');
    }

    // M3: Save Project & Create Snapshot in Version History
    function saveCurrentProject(notify = true) {
      if (!activeProjectId) return;
      editorBuffers[activeFileTab] = document.getElementById('ideCodeTextarea').value;

      const idx = projects.findIndex(p => p.id === activeProjectId);
      if (idx === -1) return;

      const title = document.getElementById('ideProjectTitle').value.trim() || 'مشروع بدون عنوان';
      const status = document.getElementById('ideProjectStatus').value;
      const priority = document.getElementById('ideProjectPriority').value;
      const description = document.getElementById('ideProjectDesc').value.trim();
      const tags = document.getElementById('ideProjectTags').value.split(',').map(t => t.trim()).filter(Boolean);
      const notes = document.getElementById('ideProjectNotes').value;
      const now = formatNow();

      const historyList = projects[idx].history || [];
      historyList.unshift({
        snapId: 'snap-' + Date.now(),
        timestamp: now,
        author: currentUser ? currentUser.name : 'عضو التيم',
        html: editorBuffers.html,
        css: editorBuffers.css,
        js: editorBuffers.js
      });
      // Keep last 15 snapshots
      if (historyList.length > 15) historyList.pop();

      projects[idx] = {
        ...projects[idx],
        title,
        status,
        priority,
        description,
        tags,
        notes,
        tasks: currentProjectTasks,
        html: editorBuffers.html,
        css: editorBuffers.css,
        js: editorBuffers.js,
        authorName: currentUser ? currentUser.name : projects[idx].authorName,
        authorEmail: currentUser ? currentUser.email : projects[idx].authorEmail,
        updatedAt: now,
        history: historyList
      };

      saveProjectsToStorage();
      if (notify) showToast(`تم حفظ المشروع وتسجيل لقطة إصدار جديدة ✓`, 'success');
    }

    function openHistoryModal() {
      const p = projects.find(x => x.id === activeProjectId);
      const listCont = document.getElementById('versionHistoryList');
      if (!p || !p.history || p.history.length === 0) {
        listCont.innerHTML = '<div class="p-6 text-center text-xs text-slate-400">لا توجد لقطات محفوظة بعد. اضغط "حفظ ولقطة" لتسجيل إصدار.</div>';
      } else {
        listCont.innerHTML = p.history.map((snap, idx) => `
          <div class="p-3 rounded-xl bg-slatebg-900 border border-slatebg-600 flex items-center justify-between text-xs">
            <div>
              <div class="font-bold text-white">إصدار #${p.history.length - idx} • <span class="text-indigo-400">${escapeHtml(snap.author)}</span></div>
              <div class="text-[11px] font-mono text-slate-400 mt-0.5" dir="ltr">${snap.timestamp}</div>
            </div>
            <button onclick="restoreSnapshot('${snap.snapId}')" class="px-3 py-1.5 rounded-lg bg-amber-600 hover:bg-amber-500 text-white font-bold">استعادة</button>
          </div>
        `).join('');
      }
      openModal('historyModal');
    }

    function restoreSnapshot(snapId) {
      const p = projects.find(x => x.id === activeProjectId);
      if (!p) return;
      const snap = (p.history || []).find(s => s.snapId === snapId);
      if (!snap) return;

      editorBuffers = { html: snap.html, css: snap.css, js: snap.js };
      switchEditorTab(activeFileTab, false);
      renderLivePreview(false);
      closeModal('historyModal');
      showToast('تمت استعادة الإصدار السابق بنجاح!', 'success');
    }

    // M4: Component Snippets
    const SNIPPETS_MAP = {
      navbar: `\n<nav style="display:flex;justify-content:space-between;align-items:center;padding:16px 32px;background:#0f172a;color:#fff;border-bottom:1px solid #1e293b;">\n  <strong style="font-size:18px;">اسم المشروع</strong>\n  <div style="display:flex;gap:20px;font-size:14px;">\n    <a href="#" style="color:#cbd5e1;text-decoration:none;">الرئيسية</a>\n    <a href="#" style="color:#cbd5e1;text-decoration:none;">المميزات</a>\n    <a href="#" style="color:#cbd5e1;text-decoration:none;">تواصل معنا</a>\n  </div>\n</nav>\n`,
      hero: `\n<section style="text-align:center;padding:64px 20px;background:linear-gradient(135deg,#1e1b4b,#0f172a);color:#fff;">\n  <h1 style="font-size:2.4rem;margin-bottom:14px;">عنوان رئيسي جذاب للمشروع</h1>\n  <p style="color:#94a3b8;max-width:560px;margin:0 auto 24px;">وصف مختصر يوضح القيمة المضافة والخدمات التي يقدمها الموقع للزوار.</p>\n  <button style="padding:12px 28px;border-radius:10px;border:none;background:#4f46e5;color:#fff;font-weight:bold;cursor:pointer;">ابدأ الآن</button>\n</section>\n`,
      pricing: `\n<section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;padding:40px 20px;max-width:960px;margin:auto;">\n  <div style="background:#1e293b;padding:24px;border-radius:16px;color:#fff;text-align:center;"><h3>الباقة الأساسية</h3><p style="font-size:28px;font-weight:bold;">$19</p><p style="color:#94a3b8;font-size:13px;">مناسبة للمشاريع الناشئة</p></div>\n  <div style="background:#312e81;border:2px solid #6366f1;padding:24px;border-radius:16px;color:#fff;text-align:center;"><h3>الباقة الاحترافية</h3><p style="font-size:28px;font-weight:bold;">$49</p><p style="color:#c7d2fe;font-size:13px;">الأكثر طلباً لفرق العمل</p></div>\n</section>\n`,
      contact: `\n<form style="max-width:440px;margin:32px auto;padding:28px;background:#1e293b;border-radius:16px;color:#fff;display:flex;flex-direction:column;gap:12px;">\n  <h3>تواصل معنا</h3>\n  <input type="text" placeholder="الاسم الكامل" style="padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;">\n  <input type="email" placeholder="البريد الإلكتروني" style="padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;">\n  <textarea rows="3" placeholder="رسالتك..." style="padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;"></textarea>\n  <button type="submit" style="padding:12px;border-radius:8px;border:none;background:#10b981;color:#fff;font-weight:bold;">إرسال</button>\n</form>\n`,
      stats: `\n<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;padding:24px;">\n  <div style="background:#1e293b;padding:20px;border-radius:14px;color:#fff;"><span style="color:#94a3b8;font-size:12px;">العملاء</span><h2 style="margin:6px 0 0;color:#38bdf8;">+2,450</h2></div>\n  <div style="background:#1e293b;padding:20px;border-radius:14px;color:#fff;"><span style="color:#94a3b8;font-size:12px;">المشاريع</span><h2 style="margin:6px 0 0;color:#34d399;">+180</h2></div>\n</div>\n`,
      footer: `\n<footer style="padding:28px;text-align:center;background:#090d16;color:#64748b;font-size:13px;border-top:1px solid #1e293b;">\n  جميع الحقوق محفوظة &copy; 2026 — تم التطوير بواسطة الفريق\n</footer>\n`
    };

    function insertSnippet(key) {
      switchEditorTab('html', true);
      const ta = document.getElementById('ideCodeTextarea');
      const snippet = SNIPPETS_MAP[key] || '';
      if (ta.value.includes('</body>')) {
        ta.value = ta.value.replace('</body>', `${snippet}\n</body>`);
      } else {
        ta.value += snippet;
      }
      editorBuffers.html = ta.value;
      updateGutterLines();
      renderLivePreview(false);
      closeModal('snippetsModal');
      showToast('تم إدراج المكون الجاهز في index.html', 'success');
    }

    // M5: 1-Click CDN Injector
    const CDN_TAGS = {
      tailwind: `<script src="https://cdn.tailwindcss.com"><\/script>`,
      fontawesome: `<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />`,
      cairo: `<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />`,
      bootstrap: `<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" />`,
      animate: `<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />`
    };

    function injectCdn(libKey) {
      switchEditorTab('html', true);
      const ta = document.getElementById('ideCodeTextarea');
      const tag = CDN_TAGS[libKey];
      if (!tag) return;

      if (ta.value.includes(tag)) {
        showToast('هذه المكتبة مضافة بالفعل في المشروع', 'info');
        closeModal('cdnModal');
        return;
      }

      if (ta.value.includes('</head>')) {
        ta.value = ta.value.replace('</head>', `  ${tag}\n</head>`);
      } else {
        ta.value = `${tag}\n` + ta.value;
      }
      editorBuffers.html = ta.value;
      updateGutterLines();
      renderLivePreview(false);
      closeModal('cdnModal');
      showToast('تم حقن رابط المكتبة في <head> بنجاح!', 'success');
    }

    // M6: Viewport Simulator
    function setSimulatorViewport(width, label) {
      document.getElementById('ideLiveIframe').style.width = width;
      document.getElementById('viewportDimBadge').textContent = label;
    }

    function togglePreviewFullscreen() {
      const ed = document.getElementById('ideEditorPane');
      const grid = document.getElementById('ideSplitGrid');
      const icon = document.getElementById('previewExpandIcon');
      isPreviewFullscreen = !isPreviewFullscreen;

      if (isPreviewFullscreen) {
        ed.classList.add('hidden');
        grid.classList.remove('lg:grid-cols-2');
        icon.classList.replace('fa-expand', 'fa-compress');
      } else {
        ed.classList.remove('hidden');
        grid.classList.add('lg:grid-cols-2');
        icon.classList.replace('fa-compress', 'fa-expand');
      }
    }

    // M7: Format & Minify Code
    function formatActiveCode() {
      const ta = document.getElementById('ideCodeTextarea');
      let code = ta.value;
      if (activeFileTab === 'html') {
        code = code.replace(/>\s+</g, '>\n<');
      } else if (activeFileTab === 'css') {
        code = code.replace(/\{\s*/g, ' {\n  ').replace(/;\s*/g, ';\n  ').replace(/\s*\}/g, '\n}\n');
      }
      ta.value = code.trim();
      editorBuffers[activeFileTab] = ta.value;
      updateGutterLines();
      showToast('تم تنسيق وتنظيم الكود', 'info');
    }

    function minifyActiveCode() {
      const ta = document.getElementById('ideCodeTextarea');
      ta.value = ta.value.replace(/\n+/g, ' ').replace(/\s{2,}/g, ' ').trim();
      editorBuffers[activeFileTab] = ta.value;
      updateGutterLines();
      showToast('تم ضغط وتصغير الكود (Minify)', 'info');
    }

    // M8: Code Audit & SEO Linter
    function runCodeAudit() {
      editorBuffers[activeFileTab] = document.getElementById('ideCodeTextarea').value;
      const html = editorBuffers.html || '';
      const issues = [];
      let score = 100;

      if (!html.includes('<!DOCTYPE html>')) {
        issues.push({ ok: false, text: 'يفضل إضافة إعلان <!DOCTYPE html> في بداية الملف.' });
        score -= 10;
      } else {
        issues.push({ ok: true, text: 'إعلان <!DOCTYPE html> سليم وموجود.' });
      }

      if (!/<title>.*<\/title>/i.test(html)) {
        issues.push({ ok: false, text: 'وسم <title> مفقود — مهم جداً لمحركات البحث (SEO).' });
        score -= 15;
      } else {
        issues.push({ ok: true, text: 'عنوان الصفحة <title> متوفر.' });
      }

      if (!/name=["']viewport["']/i.test(html)) {
        issues.push({ ok: false, text: 'وسم meta viewport مفقود — قد يؤثر على التجاوب في الهواتف.' });
        score -= 15;
      } else {
        issues.push({ ok: true, text: 'إعدادات التجاوب (Viewport) مضبوطة بشكل صحيح.' });
      }

      const imgsWithoutAlt = (html.match(/<img(?![^>]*\balt=)[^>]*>/gi) || []).length;
      if (imgsWithoutAlt > 0) {
        issues.push({ ok: false, text: `تم اكتشاف ${imgsWithoutAlt} صورة بدون خاصية alt (إمكانية الوصول).` });
        score -= 10;
      } else {
        issues.push({ ok: true, text: 'جميع الصور تحتوي على وصف بديل (alt) أو لا توجد صور مخالفة.' });
      }

      document.getElementById('auditScoreBanner').innerHTML = `
        <div>
          <div class="text-xs text-slate-400">تقييم جودة المشروع</div>
          <div class="text-lg font-black ${score >= 85 ? 'text-emerald-400' : 'text-amber-400'}">${score} / 100</div>
        </div>
        <span class="px-3 py-1 rounded-full text-xs font-bold ${score >= 85 ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300'}">
          ${score >= 85 ? 'ممتاز وجاهز للإنتاج' : 'يحتاج بعض التحسينات'}
        </span>
      `;

      document.getElementById('auditResultsList').innerHTML = issues.map(i => `
        <li class="p-3 rounded-xl bg-slatebg-900 border border-slatebg-700 flex items-center gap-2.5">
          <i class="fa-solid ${i.ok ? 'fa-circle-check text-emerald-400' : 'fa-triangle-exclamation text-amber-400'}"></i>
          <span class="text-slate-200">${i.text}</span>
        </li>
      `).join('');

      openModal('auditModal');
    }

    // M9: Find & Replace
    function toggleFindReplaceBar() {
      document.getElementById('findReplaceBar').classList.toggle('hidden');
      updateFindCount();
    }

    function updateFindCount() {
      const q = document.getElementById('findInput').value;
      const text = document.getElementById('ideCodeTextarea').value;
      if (!q) {
        document.getElementById('findMatchCount').textContent = '0 مطابقة';
        return;
      }
      const matches = text.split(q).length - 1;
      document.getElementById('findMatchCount').textContent = `${matches} مطابقة`;
    }

    function replaceNextMatch() {
      const q = document.getElementById('findInput').value;
      const rep = document.getElementById('replaceInput').value;
      if (!q) return;
      const ta = document.getElementById('ideCodeTextarea');
      if (ta.value.includes(q)) {
        ta.value = ta.value.replace(q, rep);
        editorBuffers[activeFileTab] = ta.value;
        updateGutterLines();
        updateFindCount();
        renderLivePreview(false);
        showToast('تم استبدال المطابقة التالية', 'info');
      }
    }

    function replaceAllMatches() {
      const q = document.getElementById('findInput').value;
      const rep = document.getElementById('replaceInput').value;
      if (!q) return;
      const ta = document.getElementById('ideCodeTextarea');
      ta.value = ta.value.split(q).join(rep);
      editorBuffers[activeFileTab] = ta.value;
      updateGutterLines();
      updateFindCount();
      renderLivePreview(false);
      showToast('تم استبدال جميع المطابقات في الملف', 'success');
    }

    // M11: Project Tasks & Notes Drawer
    function toggleProjectDrawer() {
      const drawer = document.getElementById('projectMetaDrawer');
      drawer.classList.toggle('hidden');
      drawer.classList.toggle('flex');
    }

    function renderTasksList() {
      const ul = document.getElementById('projectTasksList');
      if (currentProjectTasks.length === 0) {
        ul.innerHTML = '<li class="text-[11px] text-slate-500 text-center py-2">لا توجد مهام مضافة بعد</li>';
        return;
      }
      ul.innerHTML = currentProjectTasks.map((t, i) => `
        <li class="flex items-center justify-between gap-2 p-2 rounded-lg bg-slatebg-900 border border-slatebg-700 text-xs">
          <label class="flex items-center gap-2 cursor-pointer flex-1">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTaskDone(${i})" class="accent-indigo-500" />
            <span class="${t.done ? 'line-through text-slate-500' : 'text-slate-200'}">${escapeHtml(t.text)}</span>
          </label>
          <button onclick="deleteTask(${i})" class="text-slate-500 hover:text-rose-400"><i class="fa-solid fa-xmark"></i></button>
        </li>
      `).join('');
    }

    function addProjectTask() {
      const inp = document.getElementById('newTaskInput');
      const val = inp.value.trim();
      if (!val) return;
      currentProjectTasks.push({ text: val, done: false });
      inp.value = '';
      renderTasksList();
    }

    function toggleTaskDone(idx) {
      currentProjectTasks[idx].done = !currentProjectTasks[idx].done;
      renderTasksList();
    }

    function deleteTask(idx) {
      currentProjectTasks.splice(idx, 1);
      renderTasksList();
    }

    // M14: Multi-Format Export & Share URL
    function openExportModal() {
      document.getElementById('shareUrlOutput').value = '';
      openModal('exportModal');
    }

    function downloadBundledHtml() {
      editorBuffers[activeFileTab] = document.getElementById('ideCodeTextarea').value;
      const title = sanitizeFilename(document.getElementById('ideProjectTitle').value || 'project');
      const fullHtml = buildCombinedHtml(editorBuffers.html, editorBuffers.css, editorBuffers.js, false);
      triggerDownload(`${title}.html`, fullHtml, 'text/html');
      showToast(`تم تحميل ${title}.html المدمج بنجاح!`, 'success');
    }

    function copyGoogleSitesEmbed() {
      editorBuffers[activeFileTab] = document.getElementById('ideCodeTextarea').value;
      const fullHtml = buildCombinedHtml(editorBuffers.html, editorBuffers.css, editorBuffers.js, false);
      copyTextToClipboard(fullHtml);
      showToast('تم نسخ الكود المدمج! جاهز للصق في Google Sites (تضمين)', 'success');
    }

    function generateAndCopyShareUrl() {
      editorBuffers[activeFileTab] = document.getElementById('ideCodeTextarea').value;
      const payload = {
        title: document.getElementById('ideProjectTitle').value.trim() || 'مشروع مشترك',
        description: document.getElementById('ideProjectDesc').value.trim(),
        status: document.getElementById('ideProjectStatus').value,
        priority: document.getElementById('ideProjectPriority').value,
        tags: ['Shared'],
        authorName: currentUser ? currentUser.name : 'عضو الفريق',
        authorEmail: currentUser ? currentUser.email : 'team@archive.com',
        html: editorBuffers.html,
        css: editorBuffers.css,
        js: editorBuffers.js
      };
      const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
      const baseUrl = window.location.href.split('#')[0];
      const shareUrl = `${baseUrl}#share=${encoded}`;
      const out = document.getElementById('shareUrlOutput');
      out.value = shareUrl;
      copyTextToClipboard(shareUrl);
      showToast('تم توليد ونسخ رابط المشاركة المباشر!', 'success');
    }

    // 9. UTILITIES
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function triggerDownload(filename, content, mime) {
      const blob = new Blob([content], { type: `${mime};charset=utf-8` });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function copyTextToClipboard(text) {
      const temp = document.createElement('textarea');
      temp.value = text;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand('copy');
      document.body.removeChild(temp);
    }

    function sanitizeFilename(name) {
      return name.trim().replace(/[\\/:*?"<>|]/g, '_') || 'project';
    }

    function formatNow() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      let h = d.getHours();
      const m = String(d.getMinutes()).padStart(2, '0');
      const ampm = h >= 12 ? 'م' : 'ص';
      h = h % 12 || 12;
      return `${yyyy}-${mm}-${dd} ${String(h).padStart(2, '0')}:${m} ${ampm}`;
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function showToast(msg, type = 'info') {
      const cont = document.getElementById('toastContainer');
      const el = document.createElement('div');
      const bg = type === 'success' ? 'bg-emerald-600 border-emerald-400' : type === 'error' ? 'bg-rose-600 border-rose-400' : 'bg-slatebg-800 border-slatebg-600';
      el.className = `animate-toast pointer-events-auto px-4 py-3 rounded-xl border text-white text-xs font-bold shadow-2xl flex items-center gap-2 ${bg}`;
      el.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-info'}"></i><span>${msg}</span>`;
      cont.appendChild(el);
      setTimeout(() => { el.remove(); }, 3200);
    }
  </script>
</body>
</html>
